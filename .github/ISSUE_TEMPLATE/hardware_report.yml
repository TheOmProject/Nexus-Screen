name: Hardware Compatibility Report
description: Report whether Nexus Screen works (or does not work) on hardware not listed in the compatibility matrix
labels: ["hardware-compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping expand hardware compatibility knowledge.

        This form is for reporting a hardware configuration that is **not yet listed** in
        [docs/HARDWARE-COMPATIBILITY.md](https://github.com/TheOmProject/Nexus-Screen/blob/main/docs/HARDWARE-COMPATIBILITY.md),
        or for updating a "NOT TESTED" entry with a confirmed result.

  - type: dropdown
    id: result
    attributes:
      label: Result
      description: Did Nexus Screen install and run successfully on this hardware?
      options:
        - "✓ Working — installed and running correctly"
        - "✗ Failed — installation blocked or app does not run"
        - "⚠ Partial — installed but some features do not work"
    validations:
      required: true

  - type: textarea
    id: hardware
    attributes:
      label: Hardware
      description: Your exact hardware configuration.
      placeholder: |
        - SBC: Raspberry Pi 3 B+ (1 GB RAM)
        - Operating system: Raspberry Pi OS Bookworm 64-bit (aarch64)
        - Display: 3.5-inch SPI display, 480×320
        - Connector: SPI (not DSI)
        - Framebuffer: /dev/fb1 (non-standard path)
        - bits_per_pixel: 16
        - Klipper version: v0.12.0
        - Moonraker version: v0.9.0
        - Nexus Screen version: v0.2.0-beta.5
    validations:
      required: true

  - type: textarea
    id: framebuffer_info
    attributes:
      label: Framebuffer info
      description: Output of the following commands.
      value: |
        ```
        # cat /sys/class/graphics/fb0/bits_per_pixel
        # cat /sys/class/graphics/fb0/virtual_size
        # ls /dev/fb*
        # uname -m
        # cat /etc/os-release
        ```
      render: shell

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the installation result, any error messages, and what (if anything) works.
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Logs, screenshots, or anything else relevant.
